name: Validate Example NFO Files

# Workflow Strategy:
# - Use local validation for v2 schemas/examples on PRs and main/develop
# - Validate schema syntax for all branches

on:
  push:
    branches: [ main, develop, SchemaUpdate ]
    paths:
      - '**.xml'
      - '**.xsd'
      - '.github/workflows/validate-examples.yml'
      - 'tools/test_schemas.sh'
  pull_request:
    branches: [ main ]
    paths:
      - '**.xml'
      - '**.xsd'
      - 'tools/test_schemas.sh'

jobs:
  # New comprehensive validation using our test framework
  validate-with-test-framework:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/SchemaUpdate'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install xmllint
      run: sudo apt-get update && sudo apt-get install -y libxml2-utils
    
    - name: Make test script executable
      run: chmod +x tools/test_schemas.sh
    
    - name: Run comprehensive schema validation
      run: |
        echo "🧪 Running NFOStandard v2.0.0 comprehensive validation..."
        ./tools/test_schemas.sh v2
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: validation-results
        path: test_output/
        retention-days: 7

  # Python validator + test runner (offline v2)
  validate-nfo-files:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install lxml requests
    
    - name: Validate root examples (offline v2)
      run: |
        python tools/python-validator/nfo_validator.py --offline --schema-dir v2 ExampleMovie.xml SamplePodcast.xml

    - name: Validate example sets (offline v2)
      run: |
        for xml_file in examples/*.xml v2/examples/*.xml; do
          if [ -f "$xml_file" ]; then
            python tools/python-validator/nfo_validator.py --offline --schema-dir v2 "$xml_file"
          fi
        done

    - name: Run test framework (offline v2)
      run: python tests/test_runner.py --offline --schema-dir v2 tests

  dotnet-xml:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
    - uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build .NET XML toolkit
      run: dotnet build tools/dotnet-xml/NFOStandard.Xml.Console/NFOStandard.Xml.Console.csproj

    - name: Validate root examples (offline v2)
      run: dotnet run --no-build --project tools/dotnet-xml/NFOStandard.Xml.Console/NFOStandard.Xml.Console.csproj -- \
        --file ExampleMovie.xml \
        --schema-dir v2

    - name: Validate example sets (offline v2)
      run: |
        for xml_file in examples/*.xml v2/examples/*.xml; do
          if [ -f "$xml_file" ]; then
            dotnet run --no-build --project tools/dotnet-xml/NFOStandard.Xml.Console/NFOStandard.Xml.Console.csproj -- \
              --file "$xml_file" \
              --schema-dir v2
          fi
        done

  # Schema integrity validation (runs for all branches)
  validate-schema-integrity:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install xmllint
      run: sudo apt-get update && sudo apt-get install -y libxml2-utils
    
    - name: Validate XSD schemas
      run: |
        echo "Validating XSD schema files..."
        
        # Validate v1 schemas if they exist
        if [ -d "v1" ]; then
          echo "Validating v1 schemas..."
          for xsd in v1/Schemas/*.xsd v1/main.xsd; do
            if [ -f "$xsd" ]; then
              echo -n "Validating $xsd... "
              if xmllint --noout "$xsd" 2>/dev/null; then
                echo "✅ Valid"
              else
                echo "❌ Invalid"
                xmllint --noout "$xsd"
                exit 1
              fi
            fi
          done
        fi
        
        # Validate v2 schemas if they exist
        if [ -d "v2" ]; then
          echo "Validating v2 schemas..."
          for xsd in v2/Schemas/*.xsd v2/main.xsd; do
            if [ -f "$xsd" ]; then
              echo -n "Validating $xsd... "
              if xmllint --noout "$xsd" 2>/dev/null; then
                echo "✅ Valid"
              else
                echo "❌ Invalid"
                xmllint --noout "$xsd"
                exit 1
              fi
            fi
          done
        fi
        
        # Legacy validation for old structure (main branch compatibility)
        if [ -f "main.xsd" ] && [ -d "Schemas" ]; then
          echo "Validating legacy schema structure..."
          for xsd in Schemas/*.xsd main.xsd; do
            echo -n "Validating $xsd... "
            if xmllint --noout "$xsd" 2>/dev/null; then
              echo "✅ Valid"
            else
              echo "❌ Invalid"
              xmllint --noout "$xsd"
              exit 1
            fi
          done
        fi
