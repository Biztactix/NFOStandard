name: Pack NuGet (NFOStandard.Xml)

on:
  workflow_dispatch:
  push:
    tags:
      - "dotnet-xml-v*"

jobs:
  pack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pack NuGet
        run: dotnet pack tools/dotnet-xml/NFOStandard.Xml/NFOStandard.Xml.csproj -c Release -o artifacts --include-symbols --include-source

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nfo-dotnet-nuget
          path: artifacts

      - name: Publish NuGet package
        if: startsWith(github.ref, 'refs/tags/dotnet-xml-v')
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${NUGET_API_KEY}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
