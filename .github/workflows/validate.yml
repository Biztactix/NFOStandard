name: Validate Schemas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libxml2-utils
        run: sudo apt-get install -y libxml2-utils

      - name: Make validate.sh executable
        run: chmod +x validate.sh

      - name: Run validation
        run: ./validate.sh
